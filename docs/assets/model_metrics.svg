<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">기존 모델 평가 지표 비교</title><desc id="desc">model_performance_results.csv에 저장된 테스트 정확도, 기존 사용자 정의 정확도, 테스트 F1을 비교합니다.</desc><rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111827}.axis{stroke:#9ca3af;stroke-width:1}.a{fill:#4b5563}.b{fill:#6b7280}.c{fill:#9ca3af}</style><text x="55" y="48" font-size="25" font-weight="700">기존 모델 평가 지표</text><text x="55" y="76" font-size="14" fill="#6b7280">출처: model_performance_results.csv</text><line class="axis" x1="85" y1="430" x2="940" y2="430"/><line class="axis" x1="85" y1="110" x2="85" y2="430"/><text x="135" y="462" font-size="15">LSTM</text><rect class="a" x="115" y="283" width="35" height="147"/><rect class="b" x="155" y="245" width="35" height="185"/><rect class="c" x="195" y="303" width="35" height="127"/><text x="397" y="462" font-size="15">GRU</text><rect class="a" x="370" y="246" width="35" height="184"/><rect class="b" x="410" y="168" width="35" height="262"/><rect class="c" x="450" y="246" width="35" height="184"/><text x="675" y="462" font-size="15">Transformer</text><rect class="a" x="645" y="267" width="35" height="163"/><rect class="b" x="685" y="162" width="35" height="268"/><rect class="c" x="725" y="270" width="35" height="160"/><rect class="a" x="760" y="118" width="18" height="18"/><text x="788" y="132" font-size="13">테스트 정확도</text><rect class="b" x="760" y="148" width="18" height="18"/><text x="788" y="162" font-size="13">기존 사용자 정의 정확도</text><rect class="c" x="760" y="178" width="18" height="18"/><text x="788" y="192" font-size="13">테스트 F1</text><text x="55" y="500" font-size="13" fill="#6b7280">저장소의 실제 결과 파일을 시각화한 값이며 새로 만든 예시 수치가 아닙니다.</text></svg>